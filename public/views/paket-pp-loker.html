<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Paid Promote - Loker Kesehatan ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4/animate.min.css" />
    <!-- Google Fonts: modern marketplace style -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/paket-pp-loker.css">
</head>

<body>
    <div class="container">
        <!-- header marketplace dengan aksen jualan -->
        <div class="market-header">
            <div class="brand">
                <h1><i class="fas fa-store me-1"></i> Loker Kesehatan ID Advertising</h1>
                <div class="badge-market" style="margin-top: 6px;">
                    <i class="fas fa-bolt"></i> PAID PROMOTE
                </div>
            </div>
            <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>

        <div class="market-sub">
            <div class="title-section">
                <h2>🎯 Pilih Paket Promosi</h2>
                <p><i class="fas fa-chart-line"></i> Media iklan lowongan kesehatan terpercaya</p>
            </div>
            <div class="stats-badge" id="statCounter">
                <i class="fas fa-tag"></i> Tersedia <span id="totalPaket">0</span> paket promosi
            </div>
        </div>

        <!-- Kontainer grid marketplace -->
        <div id="linksContainer" class="promo-grid">
            <div class="empty-market"><i class="fas fa-spinner fa-pulse"></i> Mohon tunggu ...</div>
        </div>

        <footer>
            <a href="">Loker Kesehatan ID</a> © 2018 - <span id="year"></span>. All rights reserved.
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const toggleBtn = document.getElementById("darkToggle");
        const body = document.body;
        if (localStorage.getItem("darkMode") === "true") {
            body.classList.add("dark");
            toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }
        toggleBtn.addEventListener("click", () => {
            body.classList.toggle("dark");
            const isDark = body.classList.contains("dark");
            localStorage.setItem("darkMode", isDark);
            toggleBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyqJ4u8maNKM97iqKl511Q9K8pY5_SnJQajA6Gtt7I6-RrZfq2ZT79zbmYsmYT8Sq28/exec?site=B";

        function renderLinks(links) {
            const container = document.getElementById("linksContainer");
            container.innerHTML = "";

            const validLinks = links.filter(link =>
                link.url && link.url.trim() !== "" &&
                link.label && link.label.trim() !== ""
            );

            if (validLinks.length === 0) {
                container.innerHTML = `<div class="empty-market"><i class="fas fa-box-open"></i> Belum ada paket promote tersedia saat ini</div>`;
                document.getElementById("totalPaket").textContent = "0";
                return;
            }

            // update total paket (statistik)
            document.getElementById("totalPaket").textContent = validLinks.length;

            validLinks.forEach((link, index) => {
                let rawPrice = null;
                if (link.harga !== undefined && link.harga !== null && link.harga !== "") rawPrice = link.harga;

                let formattedPrice = "";
                if (rawPrice !== null && rawPrice !== "") {
                    // Cek apakah rawPrice adalah angka atau string numeric
                    let numericPrice = parseFloat(rawPrice.toString().replace(/[^0-9,-]/g, '').replace(',', '.'));
                    if (!isNaN(numericPrice) && isFinite(numericPrice)) {
                        formattedPrice = `Mulai dari Rp ${numericPrice.toLocaleString('id-ID')}`;
                    } else {
                        formattedPrice = rawPrice.toString();
                        if (formattedPrice.length > 35) formattedPrice = formattedPrice.substring(0, 32) + '...';
                    }
                }

                // warna accent untuk border atau badge
                let accentColor = link.color || "btn-default";
                let badgeStyle = "";
                let priceTagText = "Promo Populer";

                if (accentColor.includes("primary") || accentColor.includes("btn-primary")) {
                    badgeStyle = "background:#e0f2fe; color:#0369a1;";
                    priceTagText = "⭐ Best Value";
                } else if (accentColor.includes("success") || accentColor.includes("btn-success")) {
                    badgeStyle = "background:#dcfce7; color:#15803d;";
                    priceTagText = "🔥 Limited Deal";
                } else if (accentColor.includes("warning") || accentColor.includes("btn-warning")) {
                    badgeStyle = "background:#fef9c3; color:#854d0e;";
                    priceTagText = "⚡ Eksklusif";
                } else if (accentColor.includes("danger") || accentColor.includes("btn-danger")) {
                    badgeStyle = "background:#ffe4e2; color:#b91c1c;";
                    priceTagText = "🏷️ Special Offer";
                } else {
                    badgeStyle = "background:#e9f4ff; color:#1e6f5c;";
                    priceTagText = "✅ Premium Boost";
                }

                // Membuat deskripsi menarik dari label 
                const labelClean = link.desc;
                let descText = `Solusi promosi iklan tepat sasaran dengan paket ${labelClean}`;

                // Buat elemen kartu marketplace
                const card = document.createElement("div");
                card.className = "promo-card animate__animated animate__fadeInUp";
                card.style.animationDelay = `${index * 0.05}s`;

                // inner struktur
                card.innerHTML = `
                    <div class="card-content">
                        <div class="promo-title">
                            ${link.label}
                            <span class="promo-badge" style="${badgeStyle}">${priceTagText}</span>
                        </div>
                        <div class="promo-desc">
                            ${descText}
                        </div>
                        <div class="promo-meta">
                            <span class="price-tag"><i class="fas fa-coins"></i> ${formattedPrice}</span>
                            <button class="btn-order" data-url="${link.url}" data-label="${labelClean.replace(/['"]/g, '&quot;')}">
                                <span>Order Disini</span> <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;

                const orderBtn = card.querySelector('.btn-order');
                orderBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    window.location.href = link.url;
                });

                container.appendChild(card);
            });
        }

        // ===================== STALE-WHILE-REVALIDATE (SWR) CACHE SYSTEM =====================
        const CACHE_KEY = "promo_data_cache_swr";

        async function loadDataSWR() {
            const container = document.getElementById("linksContainer");
            let isCached = false;
            let cachedDataString = null; // Tambahkan variabel untuk menyimpan string cache

            // 1. STALE: Cek dan tampilkan data dari LocalStorage jika ada
            const cachedDataStr = localStorage.getItem(CACHE_KEY);
            if (cachedDataStr) {
                try {
                    const cachedData = JSON.parse(cachedDataStr);
                    cachedDataString = cachedDataStr; // Simpan untuk perbandingan nanti
                    renderLinks(cachedData);
                    isCached = true;
                } catch (e) {
                    console.warn("Gagal membaca cache lokal:", e);
                }
            }

            if (!isCached) {
                container.innerHTML = `<div class="empty-market"><i class="fas fa-spinner fa-pulse"></i> Mohon Tunggu...</div>`;
            }

            // 2. REVALIDATE: Ambil data terbaru dari server di background
            try {
                console.log('Mengambil data terbaru dari server...');
                const response = await fetch(WEB_APP_URL);

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const freshData = await response.json();
                const freshDataString = JSON.stringify(freshData);

                // 3. UPDATE: Cek apakah data berubah sebelum merender ulang
                if (isCached && cachedDataString === freshDataString) {
                    console.log('Data server sama dengan cache, skip render ulang.');
                    return;
                }

                localStorage.setItem(CACHE_KEY, freshDataString);
                renderLinks(freshData);

            } catch (error) {
                console.error("Gagal revalidasi data dari server:", error);

                if (!isCached) {
                    container.innerHTML = `<div class="empty-market"><i class="fas fa-exclamation-triangle"></i> Gagal menghubungi server.<br>Silakan periksa koneksi internet Anda.</div>`;
                    document.getElementById("totalPaket").textContent = "0";
                }
            }
        }

        loadDataSWR();

        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
