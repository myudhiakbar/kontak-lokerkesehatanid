<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Paid Promote - Loker Kesehatan ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4/animate.min.css" />
    <!-- Google Fonts: modern marketplace style -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/paket-pp-loker.css">
</head>

<body>
    <div class="container">
        <!-- header marketplace dengan aksen jualan -->
        <div class="market-header">
            <div class="brand">
                <h1><i class="fas fa-store me-1"></i> Loker Kesehatan ID Market</h1>
                <div class="badge-market" style="margin-top: 6px;">
                    <i class="fas fa-bolt"></i> PAID PROMOTE
                </div>
            </div>
            <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>

        <div class="market-sub">
            <div class="title-section">
                <h2>🎯 Pilih Paket Promosi</h2>
                <p><i class="fas fa-chart-line"></i> Tingkatkan visibilitas lowongan & brand kesehatanmu</p>
            </div>
            <div class="stats-badge" id="statCounter">
                <i class="fas fa-tag"></i> <span id="totalPaket">0</span> paket eksklusif
            </div>
        </div>

        <!-- Kontainer grid marketplace -->
        <div id="linksContainer" class="promo-grid">
            <div class="empty-market"><i class="fas fa-spinner fa-pulse"></i> Mohon tunggu ...</div>
        </div>

        <footer>
            <a href="">Loker Kesehatan ID</a> © 2018 - <span id="year"></span> — Marketplace Premium Boost
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Dark mode + penyimpanan localstorage + ubah icon
        const toggleBtn = document.getElementById("darkToggle");
        const body = document.body;
        if (localStorage.getItem("darkMode") === "true") {
            body.classList.add("dark");
            toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }
        toggleBtn.addEventListener("click", () => {
            body.classList.toggle("dark");
            const isDark = body.classList.contains("dark");
            localStorage.setItem("darkMode", isDark);
            toggleBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyqJ4u8maNKM97iqKl511Q9K8pY5_SnJQajA6Gtt7I6-RrZfq2ZT79zbmYsmYT8Sq28/exec?site=B";

        // semua link yang valid memiliki url, label, icon, color (opsional) dan akan ditampilkan sebagai kartu dengan aksi klik ke url (target _blank)
        // bahkan menambahkan efek sweetalert2 jika diperlukan (contoh: order konfirmasi)
        function renderLinks(links) {
            const container = document.getElementById("linksContainer");
            container.innerHTML = "";

            // Filter valid link (sama seperti kode awal)
            const validLinks = links.filter(link =>
                link.url && link.url.trim() !== "" &&
                link.label && link.label.trim() !== ""
            );

            if (validLinks.length === 0) {
                container.innerHTML = `<div class="empty-market"><i class="fas fa-box-open"></i> Belum ada paket promote tersedia saat ini</div>`;
                document.getElementById("totalPaket").textContent = "0";
                return;
            }

            // update total paket (statistik)
            document.getElementById("totalPaket").textContent = validLinks.length;

            validLinks.forEach((link, index) => {
                // Menentukan icon yang dipakai (jika ada icon dari data, gunakan itu, fallback ke fa-bullhorn)
                let iconHtml = '';
                if (link.icon && link.icon.trim() !== "") {
                    // jika icon dari data mengandung kelas fontawesome seperti "fas fa-fire" kita render langsung
                    iconHtml = `<i class="${link.icon}"></i>`;
                } else {
                    iconHtml = `<i class="fas fa-chart-simple"></i>`;
                }

                // AMBIL DATA HARGA DARI GAS
                let rawPrice = null;
                if (link.harga !== undefined && link.harga !== null && link.harga !== "") rawPrice = link.harga;

                let formattedPrice = "";
                if (rawPrice !== null && rawPrice !== "") {
                    // Cek apakah rawPrice adalah angka atau string numeric
                    let numericPrice = parseFloat(rawPrice.toString().replace(/[^0-9,-]/g, '').replace(',', '.'));
                    if (!isNaN(numericPrice) && isFinite(numericPrice)) {
                        formattedPrice = `Harga Rp ${numericPrice.toLocaleString('id-ID')}`;
                    } else {
                        // Jika bukan angka murni, tampilkan teks asli
                        formattedPrice = rawPrice.toString();
                        // pastikan tidak terlalu panjang
                        if (formattedPrice.length > 35) formattedPrice = formattedPrice.substring(0, 32) + '...';
                    }
                }

                // warna accent untuk border atau badge
                let accentColor = link.color || "btn-default";
                // mapping warna style untuk memberikan badge warna yang menarik
                let badgeStyle = "";
                let priceTagText = "Promo Populer";
                if (accentColor.includes("primary") || accentColor.includes("btn-primary")) {
                    badgeStyle = "background:#e0f2fe; color:#0369a1;";
                    priceTagText = "⭐ Best Value";
                } else if (accentColor.includes("success") || accentColor.includes("btn-success")) {
                    badgeStyle = "background:#dcfce7; color:#15803d;";
                    priceTagText = "🔥 Limited Deal";
                } else if (accentColor.includes("warning") || accentColor.includes("btn-warning")) {
                    badgeStyle = "background:#fef9c3; color:#854d0e;";
                    priceTagText = "⚡ Eksklusif";
                } else if (accentColor.includes("danger") || accentColor.includes("btn-danger")) {
                    badgeStyle = "background:#ffe4e2; color:#b91c1c;";
                    priceTagText = "🏷️ Special Offer";
                } else {
                    badgeStyle = "background:#e9f4ff; color:#1e6f5c;";
                    priceTagText = "✅ Premium Boost";
                }

                // Membuat deskripsi menarik dari label 
                const labelClean = link.label;
                let descText = `Paket paid promote untuk menjangkau ribuan talenta kesehatan.`;
                descText = `Tingkatkan klik hingga 3x lipat dengan paket ${labelClean}`;

                // Buat elemen kartu marketplace
                const card = document.createElement("div");
                card.className = "promo-card animate__animated animate__fadeInUp";
                card.style.animationDelay = `${index * 0.05}s`;

                // inner struktur
                card.innerHTML = `
                    <div class="card-media">
                        ${iconHtml}
                    </div>
                    <div class="card-content">
                        <div class="promo-title">
                            ${labelClean}
                            <span class="promo-badge" style="${badgeStyle}">${priceTagText}</span>
                        </div>
                        <div class="promo-desc">
                            ${descText}
                        </div>
                        <div class="promo-meta">
                            <span class="price-tag"><i class="fas fa-coins"></i> ${formattedPrice}</span>
                            <button class="btn-order" data-url="${link.url}" data-label="${labelClean.replace(/['"]/g, '&quot;')}">
                                <span>Beli Paket</span> <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;

                // agar seluruh kartu bisa diklik juga (UX marketplace) namun jangan bentrok dengan tombol
                card.addEventListener("click", (e) => {
                    // jika klik berasal dari tombol order, sudah ditangani sendiri, jangan double fire
                    if (e.target.closest('.btn-order')) return;
                    // buka link utama
                    window.open(link.url, '_blank');
                });

                // Event khusus tombol order (dengan sweetalert2 ringan & tetap navigasi)
                const orderBtn = card.querySelector('.btn-order');
                orderBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const targetUrl = orderBtn.getAttribute("data-url");
                    const labelProduct = orderBtn.getAttribute("data-label");
                });

                container.appendChild(card);
            });
        }

        // ===================== OFFLINE CACHE SYSTEM =====================
        const CACHE_KEY = 'promo_data_cache';
        const CACHE_TIMESTAMP_KEY = 'promo_cache_timestamp';
        const CACHE_DURATION = 24 * 60 * 60 * 1000; // 24 jam (bisa disesuaikan)

        // Fungsi untuk menyimpan data ke localStorage
        function saveToCache(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_TIMESTAMP_KEY, Date.now().toString());
                console.log('Data berhasil disimpan ke cache');
                return true;
            } catch (e) {
                console.error('Gagal menyimpan cache:', e);
                return false;
            }
        }

        // Fungsi untuk mengambil data dari cache
        function loadFromCache() {
            try {
                const cachedData = localStorage.getItem(CACHE_KEY);
                const cacheTimestamp = localStorage.getItem(CACHE_TIMESTAMP_KEY);

                if (!cachedData || !cacheTimestamp) {
                    console.log('Cache tidak ditemukan');
                    return null;
                }

                // Cek apakah cache masih valid (opsional)
                const cacheAge = Date.now() - parseInt(cacheTimestamp);
                if (cacheAge > CACHE_DURATION) {
                    console.log('Cache sudah kadaluarsa');
                    return null;
                }

                const data = JSON.parse(cachedData);
                console.log('Data berhasil dimuat dari cache');
                return data;
            } catch (e) {
                console.error('Gagal memuat cache:', e);
                return null;
            }
        }

        // Fungsi untuk cek koneksi internet
        function isOnline() {
            return navigator.onLine;
        }

        // Fungsi utama untuk memuat data (online/offline)
        async function loadDataWithOfflineSupport() {
            const container = document.getElementById("linksContainer");

            // Tampilkan loading
            container.innerHTML = `<div class="empty-market"><i class="fas fa-spinner fa-pulse"></i> Mohon Tunggu...</div>`;

            // Coba ambil data dari network jika online
            if (isOnline()) {
                try {
                    console.log('Mencoba mengambil data dari server...');
                    const response = await fetch(WEB_APP_URL);

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();

                    // Simpan ke cache untuk offline
                    saveToCache(data);

                    // Render data
                    renderLinks(data);

                    return;
                } catch (err) {
                    console.error('Fetch error:', err);
                    // Jika gagal fetch online, coba ambil dari cache
                    const cachedData = loadFromCache();
                    if (cachedData) {
                        renderLinks(cachedData);
                        Swal.fire({
                            title: 'Mode Offline Terbatas',
                            text: 'Gagal update data dari server',
                            icon: 'warning',
                            confirmButtonText: 'OK'
                        });
                        return;
                    }

                    // Jika tidak ada cache sama sekali
                    container.innerHTML = `<div class="empty-market"><i class="fas fa-wifi"></i> Tidak ada koneksi internet<br>dan tidak ada data tersimpan.<br>Silakan coba lagi saat online.</div>`;
                    document.getElementById("totalPaket").textContent = "0";
                }
            } else {
                // Mode offline - langsung ambil dari cache
                console.log('Mode offline: Mengambil dari cache');
                const cachedData = loadFromCache();

                if (cachedData) {
                    renderLinks(cachedData);
                    // Swal.fire({
                    //     title: 'Mode Offline',
                    //     text: 'Koneksi internet anda terputus',
                    //     icon: 'warning',
                    //     toast: true,
                    //     position: 'top-end',
                    //     showConfirmButton: false,
                    //     timer: 3000
                    // });
                    Swal.fire({
                        title: 'Mode Offline',
                        text: 'Anda sedang offline. Cek kembali koneksi internet anda',
                        icon: 'info',
                        confirmButtonText: 'OK'
                    });
                } else {
                    container.innerHTML = `<div class="empty-market"><i class="fas fa-cloud-slash"></i> Anda sedang offline<br>dan belum pernah memuat data sebelumnya.<br>Silakan online terlebih dahulu untuk mengakses.</div>`;
                    document.getElementById("totalPaket").textContent = "0";
                }
            }
        }

        // Deteksi perubahan koneksi (online/offline)
        window.addEventListener('online', function () {
            Swal.fire({
                title: 'Mode Online',
                text: 'Koneksi internet anda tersedia',
                icon: 'success',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000
            });
            loadDataWithOfflineSupport(); // Reload data saat online kembali
        });

        window.addEventListener('offline', function () {
            // Swawal.fire({
            //     title: 'Mode Offline',
            //     text: 'Koneksi internet anda terputus',
            //     icon: 'warning',
            //     toast: true,
            //     position: 'top-end',
            //     showConfirmButton: false,
            //     timer: 3000
            // });
            loadDataWithOfflineSupport();
        });

        // GANTI panggilan fetch() dengan fungsi baru
        loadDataWithOfflineSupport();

        // ===================== END OFFLINE CACHE SYSTEM =====================

        // Tahun dinamis
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
